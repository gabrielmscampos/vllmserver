[build-system]
requires = ["setuptools>=77", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllmserver"
dynamic = ["version"]
description = "Model server implementation for vLLM. Not intended for use outside KServe."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    { name = "Gabriel Moreira", email = "gabrielmscampos@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3,<1",
    "kserve>=0.17.0,<1",
    "kserve-storage>=0.17.0,<1",
    "torch>=2.10.0,<3",
    "transformers>=4.57.6,<5",
    "vllm>=0.19.0,<1",
]

[dependency-groups]
lint = [
    "ruff>=0.15.10",
]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
version_file = "vllmserver/_version.py"
