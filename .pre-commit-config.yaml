repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: >
            (?x)^(
                uv\.lock
            )$
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pandas-stubs>=3.0.0.260204
          - scipy-stubs>=1.17.1.4
          - types-cachetools>=6.2.0.20260408
          - types-colorama>=0.4.15.20260408
          - types-defusedxml>=0.7.0.20260408
          - types-grpcio>=1.0.0.20260408
          - types-gunicorn>=25.3.0.20260408
          - types-jsonschema>=4.26.0.20260408
          - types-networkx>=3.6.1.20260408
          - types-pexpect>=4.9.0.20260408
          - types-protobuf>=7.34.1.20260408
          - types-psutil>=7.2.2.20260408
          - types-pyasn1>=0.6.0.20260408
          - types-pygments>=2.20.0.20260408
          - types-pywin32>=311.0.0.20260408
          - types-pyyaml>=6.0.12.20260408
          - types-regex>=2026.4.4.20260408
          - types-requests>=2.33.0.20260408
          - types-setuptools>=82.0.0.20260408
          - types-simplejson>=3.20.0.20260408
          - types-tabulate>=0.10.0.20260408
          - types-tensorflow>=2.18.0.20260408
          - types-tqdm>=4.67.3.20260408
